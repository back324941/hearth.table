<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>搭伙份量計算器</title>
  <style>
    :root {
      --bg: #fff8f0;
      --card: #ffffff;
      --primary: #ff8a65;
      --primary-dark: #e76f51;
      --secondary: #7fc8a9;
      --text: #3f3a36;
      --muted: #8a817c;
      --line: #f1dfd2;
      --soft: #fff1e7;
      --green-soft: #edf8f2;
      --danger: #ff6b6b;
      --shadow: 0 10px 26px rgba(120, 72, 40, 0.12);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, #ffe7d4 0, transparent 34%),
        radial-gradient(circle at top right, #e3f6ed 0, transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 14px 36px;
    }

    .hero {
      padding: 22px 18px;
      border-radius: 28px;
      background: linear-gradient(135deg, #fff, #fff3e9);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "🍱";
      position: absolute;
      right: 18px;
      top: 14px;
      font-size: 58px;
      opacity: 0.22;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 680px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(241, 223, 210, 0.9);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-title h2 {
      margin: 0;
      font-size: 21px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--soft);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .member-form {
      display: grid;
      gap: 12px;
    }

    label {
      font-size: 14px;
      font-weight: 700;
      color: #5b5049;
    }

    select,
    input[type="number"] {
      width: 100%;
      border: 2px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 16px;
      padding: 13px 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus,
    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 138, 101, 0.14);
    }

    .check-row {
      display: grid;
      gap: 10px;
    }

    .check-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      background: #fffaf6;
      border: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
    }

    .check-card input {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .check-card span {
      font-size: 15px;
      font-weight: 700;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      margin-top: -4px;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
      min-height: 50px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #ffb084);
      color: white;
      box-shadow: 0 10px 20px rgba(255, 138, 101, 0.24);
    }

    .btn-danger {
      background: #fff0f0;
      color: #d94a4a;
      border: 1px solid #ffd0d0;
      min-height: 42px;
      padding: 10px 12px;
      font-size: 15px;
    }

    .members {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .member-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      background: #fffaf6;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }

    .member-main {
      min-width: 0;
    }

    .member-name {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .member-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .empty {
      padding: 18px;
      border-radius: 18px;
      background: #fffaf6;
      border: 1px dashed #e7cbb8;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      background: var(--green-soft);
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #d7efe4;
    }

    .metric:nth-child(2) {
      background: var(--soft);
      border-color: #f6d8c5;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 26px;
      font-weight: 1000;
      letter-spacing: -0.5px;
    }

    .price-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .price-field {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      align-items: center;
      gap: 10px;
      background: #fffaf6;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
    }

    .price-field input {
      text-align: right;
      font-weight: 900;
      padding: 10px;
      border-radius: 12px;
    }

    .fixed-price-note {
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: #edf8f2;
      border: 1px solid #d7efe4;
      color: #398368;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.6;
    }

    .recommendations {
      display: grid;
      gap: 12px;
    }

    .plan {
      border-radius: 22px;
      padding: 16px;
      background: linear-gradient(135deg, #ffffff, #fff8f2);
      border: 1px solid var(--line);
      box-shadow: 0 8px 18px rgba(120, 72, 40, 0.08);
    }

    .plan-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .plan-title {
      font-size: 25px;
      font-weight: 1000;
      margin: 0;
      line-height: 1.2;
    }

    .plan-price {
      font-size: 20px;
      font-weight: 1000;
      color: var(--primary-dark);
      white-space: nowrap;
    }

    .plan-main-line {
      color: #5f554f;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.6;
      margin: 0 0 8px;
    }

    .plan-addon-line {
      color: #5f554f;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.6;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 16px;
      background: #fffaf6;
      border: 1px solid var(--line);
    }

    .reason-box {
      margin: 10px 0 12px;
      padding: 12px;
      border-radius: 16px;
      background: #fff1e7;
      border: 1px solid #f6d8c5;
    }

    .reason-title {
      color: #9b6a52;
      font-size: 13px;
      font-weight: 1000;
      margin-bottom: 6px;
    }

    .reason-text {
      color: #d9623c;
      font-size: 15px;
      font-weight: 1000;
      line-height: 1.5;
    }

    .simple-stats {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .simple-stat-line {
      padding: 10px 12px;
      border-radius: 15px;
      background: #ffffff;
      border: 1px solid #f2e2d7;
      color: #4f453f;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.6;
    }

    .simple-stat-line.over {
      background: #fff7ed;
    }


    .plan.featured {
      border: 3px solid #ffb084;
      background: linear-gradient(135deg, #fffaf6, #fff0e4);
      transform: translateY(-2px);
    }

    .plan.rich {
      border: 3px solid #bfe9d7;
      background: linear-gradient(135deg, #ffffff, #eefaf4);
    }

    .plan.bento {
      border: 3px solid #ffd7a8;
      background: linear-gradient(135deg, #ffffff, #fff7e8);
    }

    .plan-ribbon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 1000;
      margin-bottom: 10px;
      background: #fff1e7;
      color: #d9623c;
    }

    .plan.rich .plan-ribbon {
      background: #edf8f2;
      color: #398368;
    }

    .plan.bento .plan-ribbon {
      background: #fff7df;
      color: #b7791f;
    }

    .plan-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
    }

    .plan-content-box {
      margin: 12px 0;
      padding: 12px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #f2e2d7;
    }

    .plan-content-title {
      color: #8a817c;
      font-size: 13px;
      font-weight: 1000;
      margin-bottom: 6px;
    }

    .plan-content-text {
      color: #4f453f;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.6;
    }

    .nutrition-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .nutrition-chip {
      border-radius: 18px;
      padding: 12px 10px;
      background: #fffaf6;
      border: 1px solid var(--line);
      text-align: center;
    }

    .nutrition-chip.protein {
      background: #fff3ef;
      border-color: #ffd7c8;
    }

    .nutrition-chip.veggie {
      background: #edf8f2;
      border-color: #d7efe4;
    }

    .nutrition-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .nutrition-value {
      color: #3f3a36;
      font-size: 24px;
      font-weight: 1000;
      letter-spacing: -0.5px;
    }

    .gap-box {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }

    .gap-line {
      padding: 10px 12px;
      border-radius: 15px;
      background: #ffffff;
      border: 1px solid #f2e2d7;
      color: #4f453f;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.6;
    }

    .fit-message {
      padding: 12px;
      border-radius: 16px;
      background: #fff1e7;
      border: 1px solid #f6d8c5;
      color: #d9623c;
      font-size: 15px;
      font-weight: 1000;
      line-height: 1.6;
      margin: 12px 0;
    }

    .apply-btn {
      margin-top: 12px;
      background: linear-gradient(135deg, #3f3a36, #6b5b51);
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(63, 58, 54, 0.18);
    }

    .rice-card {
      background: linear-gradient(135deg, #ffffff, #edf8f2);
      border: 1px solid #d7efe4;
    }

    .rice-result {
      display: grid;
      gap: 10px;
    }

    .rice-big {
      font-size: 34px;
      font-weight: 1000;
      color: #398368;
      letter-spacing: -0.5px;
    }

    .rice-note {
      color: #5f554f;
      font-size: 14px;
      line-height: 1.7;
    }

    .footer-note {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
    }

    @media (min-width: 760px) {
      .app {
        padding: 28px 22px 52px;
      }

      h1 {
        font-size: 36px;
      }

      .grid {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .member-form {
        grid-template-columns: 1fr 1fr;
        align-items: end;
      }

      .member-form .full {
        grid-column: 1 / -1;
      }

      .check-row {
        grid-template-columns: 1fr 1fr;
      }

      .price-grid {
        grid-template-columns: 1fr 1fr;
      }

      .recommendations {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>搭伙份量計算器 🍱</h1>
      <p class="subtitle">
        今晚吃多少？幫你算份量、推薦套餐、加點與洗米量。
      </p>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-title">
          <h2>家庭成員管理</h2>
          <span class="badge" id="memberCount">0 位</span>
        </div>

        <div class="member-form">
          <div>
            <label for="memberType">成員類型</label>
            <select id="memberType">
              <option value="child">兒童</option>
              <option value="female">女性</option>
              <option value="male">男性</option>
              <option value="training">重訓</option>
            </select>
          </div>

          <div class="full check-row">
            <label class="check-card">
              <input type="checkbox" id="bigAppetite" />
              <span>食量大（肉類 +50g）</span>
            </label>

            <label class="check-card">
              <input type="checkbox" id="lessVeggie" />
              <span>不愛吃菜（蔬菜 -50g）</span>
            </label>

            <label class="check-card">
              <input type="checkbox" id="lessRice" />
              <span>飯量少</span>
            </label>
          </div>

          <p class="hint full">提醒：兒童不適用「食量大」與「不愛吃菜」，選擇兒童時會自動忽略。</p>

          <div class="full">
            <button class="btn btn-primary" id="addMemberBtn">＋ 新增成員</button>
          </div>
        </div>

        <div class="members" id="members"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <h2>需求總覽</h2>
          <span class="badge">即時計算</span>
        </div>

        <div class="summary">
          <div class="metric">
            <div class="metric-label">需要的肉類份量</div>
            <div class="metric-value"><span id="proteinNeed">0</span>g</div>
          </div>
          <div class="metric">
            <div class="metric-label">需要的蔬菜份量</div>
            <div class="metric-value"><span id="veggieNeed">0</span>g</div>
          </div>
        </div>

        <div class="footer-note">
          推薦以「最接近需求、加點少、價格低」排序；多人或肉量需求高時會適度納入雙主菜餐。
        </div>
      </div>

      <div class="card wide">
        <div class="card-title">
          <h2>價格設定區</h2>
          <span class="badge">可自行修改</span>
        </div>

        <div class="price-grid">
          <div class="price-field">
            <label for="priceLight">輕享餐價格</label>
            <input type="number" id="priceLight" min="0" value="300" />
          </div>

          <div class="price-field">
            <label for="priceLightUpgrade">輕享餐升級主菜</label>
            <input type="number" id="priceLightUpgrade" min="0" value="75" />
          </div>

          <div class="price-field">
            <label for="priceDouble">雙主菜餐價格</label>
            <input type="number" id="priceDouble" min="0" value="590" />
          </div>

          <div class="price-field">
            <label for="priceLargeMain">大份主菜加點價格</label>
            <input type="number" id="priceLargeMain" min="0" value="180" />
          </div>

          <div class="price-field">
            <label for="priceLargeSide">大份副菜加點價格</label>
            <input type="number" id="priceLargeSide" min="0" value="90" />
          </div>

          <div class="price-field">
            <label for="priceSmallMain">小份主菜加點價格</label>
            <input type="number" id="priceSmallMain" min="0" value="110" />
          </div>

          <div class="price-field">
            <label for="priceSmallSide">小份副菜加點價格</label>
            <input type="number" id="priceSmallSide" min="0" value="60" />
          </div>
        </div>

        <div class="fixed-price-note">
          時蔬基本已含在套餐內，不能額外加點；加大 +$20、雙拼 +$60。
        </div>
      </div>

      <div class="card wide">
        <div class="card-title">
          <h2>推薦方案</h2>
          <span class="badge">前 3 名</span>
        </div>

        <div class="recommendations" id="recommendations"></div>
      </div>

      <div class="card wide rice-card">
        <div class="card-title">
          <h2>今日煮飯量</h2>
          <span class="badge">貼心小提醒</span>
        </div>

        <div class="rice-result" id="riceResult"></div>
      </div>
    </section>
  </main>

  <script>
    const ORDER_SYSTEM_URL = "https://back324941.github.io/-Hearthtable/";

    const nutritionBase = {
      child: { label: "兒童", protein: 75, veggie: 60, emoji: "🧒" },
      female: { label: "女性", protein: 105, veggie: 120, emoji: "👩" },
      male: { label: "男性", protein: 135, veggie: 150, emoji: "👨" },
      training: { label: "重訓", protein: 200, veggie: 180, emoji: "💪" }
    };

    const riceBase = {
      child: { normal: 0.3, less: 0.3 },
      female: { normal: 0.4, less: 0.3 },
      male: { normal: 0.6, less: 0.5 },
      training: { normal: 0.7, less: 0.6 }
    };

    const fixedVeggiePrices = {
      vegBasic: 0,
      vegLarge: 20,
      vegDouble: 60
    };

    const members = [];

    const els = {
      memberType: document.getElementById("memberType"),
      bigAppetite: document.getElementById("bigAppetite"),
      lessVeggie: document.getElementById("lessVeggie"),
      lessRice: document.getElementById("lessRice"),
      addMemberBtn: document.getElementById("addMemberBtn"),
      members: document.getElementById("members"),
      memberCount: document.getElementById("memberCount"),
      proteinNeed: document.getElementById("proteinNeed"),
      veggieNeed: document.getElementById("veggieNeed"),
      recommendations: document.getElementById("recommendations"),
      riceResult: document.getElementById("riceResult"),
      prices: {
        light: document.getElementById("priceLight"),
        lightUpgrade: document.getElementById("priceLightUpgrade"),
        double: document.getElementById("priceDouble"),
        largeMain: document.getElementById("priceLargeMain"),
        largeSide: document.getElementById("priceLargeSide"),
        smallMain: document.getElementById("priceSmallMain"),
        smallSide: document.getElementById("priceSmallSide")
      }
    };

    function numberValue(input) {
      const value = Number(input.value);
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function getPrices() {
      return {
        light: numberValue(els.prices.light),
        lightUpgrade: numberValue(els.prices.lightUpgrade),
        double: numberValue(els.prices.double),
        largeMain: numberValue(els.prices.largeMain),
        largeSide: numberValue(els.prices.largeSide),
        smallMain: numberValue(els.prices.smallMain),
        smallSide: numberValue(els.prices.smallSide),
        vegBasic: fixedVeggiePrices.vegBasic,
        vegLarge: fixedVeggiePrices.vegLarge,
        vegDouble: fixedVeggiePrices.vegDouble
      };
    }

    function formatMoney(value) {
      return "$" + Math.round(value).toLocaleString("zh-Hant-TW") + " 起";
    }

    function addMember() {
      const type = els.memberType.value;
      const isChild = type === "child";

      members.push({
        id: Date.now() + Math.random(),
        type,
        bigAppetite: isChild ? false : els.bigAppetite.checked,
        lessVeggie: isChild ? false : els.lessVeggie.checked,
        lessRice: els.lessRice.checked
      });

      els.bigAppetite.checked = false;
      els.lessVeggie.checked = false;
      els.lessRice.checked = false;
      render();
    }

    function removeMember(id) {
      const index = members.findIndex(member => member.id === id);
      if (index >= 0) {
        members.splice(index, 1);
        render();
      }
    }

    function calculateNeeds() {
      return members.reduce((total, member) => {
        const base = nutritionBase[member.type];
        const isChild = member.type === "child";

        let protein = base.protein;
        let veggie = base.veggie;

        if (!isChild && member.bigAppetite) protein += 50;
        if (!isChild && member.lessVeggie) veggie -= 50;

        total.protein += protein;
        total.veggie += Math.max(0, veggie);

        return total;
      }, { protein: 0, veggie: 0 });
    }

    function calculateRiceCups() {
      return members.reduce((total, member) => {
        const rule = riceBase[member.type];
        total += member.lessRice ? rule.less : rule.normal;
        return total;
      }, 0);
    }

    function getFitLabel(proteinNeed, veggieNeed) {
      const totalNeed = proteinNeed + veggieNeed;

      if (totalNeed <= 520) return "適合：2~3人家庭";
      if (totalNeed <= 760) return "適合：3~4人家庭";
      return "適合：4~5人家庭";
    }

    function getReasonCandidates(plan, allPlans) {
      const minOverScore = Math.min(...allPlans.map(item => item.overScore));
      const minAddonCount = Math.min(...allPlans.map(item => item.totalAddonCount));
      const minPrice = Math.min(...allPlans.map(item => item.price));

      const candidates = [];

      if (plan.overScore === minOverScore) {
        candidates.push("⭐ 今天最推薦：這組份量剛剛好，吃飽又不容易剩太多");
      }

      if (plan.proteinOver >= 250 || plan.veggieOver >= 250) {
        candidates.push("⭐ 家庭熱門：如果今天的菜剛好是家人愛的，可以多一點");
      }
if (
  members.length <= 2 &&
  plan.proteinOver >= 130 &&
  plan.veggieOver >= 120
) {
  candidates.push(
    "⭐ 份量偏多：這組對今天人數來說比較充足，或許可以順便留一份便當"
  );
}

      if (plan.totalAddonCount === minAddonCount && plan.totalAddonCount > 0) {
        candidates.push("⭐ 懶人首選：加點少、點餐簡單，忙碌晚餐很適合");
      }

      if (plan.totalAddonCount >= 3) {
        candidates.push("⭐ 菜色豐富：菜色種類豐富，大家比較有選擇");
      }

      if (plan.veggieOver >= 150 || plan.vegMode === "large" || plan.vegMode === "double") {
        candidates.push("⭐ 均衡飲食：多一點時蔬，整餐更均衡");
      }

      if (plan.mealKey === "double") {
        candidates.push("⭐ 大家庭推薦：家裡人多，這組比較省事");
      }

      if (plan.price === minPrice) {
        candidates.push("⭐ 精打細算：想顧預算的話，這組最划算");
      }

      if (plan.proteinOver <= 100) {
        candidates.push("⭐ 清爽選擇：今天太熱、食慾可能不佳，這組肉量不會太負擔");
      }

      if (plan.vegSideCount > 0) {
        candidates.push("⭐ 補充蔬菜：蔬菜不夠時補一份（蔬菜類）副菜，營養更完整");
      }

      return candidates;
    }

    function assignReasons(plans) {
      const usedReasons = new Set();

      const fallbackReasons = [
        "⭐ 今天最推薦：這組份量剛剛好，吃飽又不容易剩太多",
        "⭐ 家庭熱門：如果今天的菜剛好是家人愛的，可以多一點",
        "⭐ 懶人首選：加點少、點餐簡單，忙碌晚餐很適合",
        "⭐ 菜色豐富：菜色種類豐富，大家比較有選擇",
        "⭐ 均衡飲食：多一點時蔬，整餐更均衡",
        "⭐ 大家庭推薦：家裡人多，這組比較省事",
        "⭐ 精打細算：想顧預算的話，這組最划算",
        "⭐ 清爽選擇：今天太熱、食慾可能不佳，這組肉量不會太負擔",
        "⭐ 補充蔬菜：蔬菜不夠時補一份（蔬菜類）副菜，營養更完整"
      ];

      plans.forEach(plan => {
        const candidates = getReasonCandidates(plan, plans);
        let selectedReason = candidates.find(reason => !usedReasons.has(reason));

        if (!selectedReason) {
          selectedReason = fallbackReasons.find(reason => !usedReasons.has(reason));
        }

        if (!selectedReason) {
          selectedReason = fallbackReasons[0];
        }

        plan.reason = selectedReason;
        usedReasons.add(selectedReason);
      });

      return plans;
    }

    function getDynamicProteinLimit(needs) {
      const maxBaseProtein = 900;
      const shortage = Math.max(0, needs.protein - maxBaseProtein);
      const largeCount = Math.ceil(shortage / 300) + 3;
      return Math.min(Math.max(largeCount, 4), 18);
    }

    function makePlanKey(plan) {
      return [
        plan.mealKey,
        plan.largeAddonCount,
        plan.smallAddonCount,
        plan.mainAddonForVeggie,
        plan.vegMode,
        plan.vegSideCount
      ].join("-");
    }

    function createVeggieCandidates(targetVeggie, currentVeggie) {
      const shortage = Math.max(0, targetVeggie - currentVeggie);
      const vegSideCount = shortage > 0 ? Math.ceil(shortage / 200) : 0;

      return [{
        vegSideCount
      }];
    }

    function shouldIncludeDoublePlan(needs, sortedPlans) {
      const bestLightPlan = sortedPlans.find(plan => plan.mealKey !== "double");
      const bestDoublePlan = sortedPlans.find(plan => plan.mealKey === "double");

      if (!bestDoublePlan) return false;

      const familySizeHigh = members.length >= 4;
      const proteinNeedHigh = needs.protein >= 700;
      const lightNeedsManyAddons = bestLightPlan ? bestLightPlan.totalAddonCount >= 2 : false;
      const lightPriceCloseToDouble = bestLightPlan ? bestLightPlan.price >= bestDoublePlan.price * 0.85 : false;
      const lightOrderTooComplex = bestLightPlan ? bestLightPlan.orderOptions.length >= 4 : false;

      return familySizeHigh || proteinNeedHigh || lightNeedsManyAddons || lightPriceCloseToDouble || lightOrderTooComplex;
    }

    function enumerateRecommendations(needs) {
      const prices = getPrices();
      const proteinLimit = getDynamicProteinLimit(needs);

      const meals = [
        {
          key: "light-basic",
          name: "輕享餐",
          baseProtein: 300,
          basePrice: prices.light,
          upgradeLabel: ""
        },
        {
          key: "light-upgrade",
          name: "輕享餐",
          baseProtein: 450,
          basePrice: prices.light + prices.lightUpgrade,
          upgradeLabel: "主菜升級"
        },
        {
          key: "double",
          name: "雙主菜餐",
          baseProtein: 900,
          basePrice: prices.double,
          upgradeLabel: ""
        }
      ];

      const veggieModes = [
        {
          key: "basic",
          label: "",
          grams: 200,
          price: prices.vegBasic
        },
        {
          key: "large",
          label: "時蔬加大",
          grams: 300,
          price: prices.vegLarge
        },
        {
          key: "double",
          label: "時蔬雙拼",
          grams: 400,
          price: prices.vegDouble
        }
      ];

      const plans = [];

      meals.forEach(meal => {
        for (let largeAddonCount = 0; largeAddonCount <= proteinLimit; largeAddonCount++) {
          for (let smallAddonCount = 0; smallAddonCount <= 1; smallAddonCount++) {
            const proteinAddon = largeAddonCount * 300 + smallAddonCount * 150;
            const protein = meal.baseProtein + proteinAddon;

            if (protein < needs.protein) continue;

            const possibleMainVeggie = largeAddonCount * 60 + smallAddonCount * 30;
            const mainVeggieOptions = [0];

            if (possibleMainVeggie > 0 && 200 < needs.veggie) {
              mainVeggieOptions.push(possibleMainVeggie);
            }

            mainVeggieOptions.forEach(mainAddonForVeggie => {
              veggieModes.forEach(vegMode => {
                const veggieBeforeSide = vegMode.grams + mainAddonForVeggie;
                const veggieCandidates = createVeggieCandidates(needs.veggie, veggieBeforeSide);

                veggieCandidates.forEach(veg => {
                  const veggie =
                    vegMode.grams
                    + mainAddonForVeggie
                    + veg.vegSideCount * 200;

                  if (veggie < needs.veggie) return;

                  const proteinAddonCount = largeAddonCount + smallAddonCount;
                  const veggieAddonCount = (vegMode.key === "basic" ? 0 : 1) + veg.vegSideCount;
                  const totalAddonCount = proteinAddonCount + veggieAddonCount;

                  const price =
                    meal.basePrice
                    + largeAddonCount * prices.largeSide
                    + smallAddonCount * prices.smallSide
                    + vegMode.price
                    + veg.vegSideCount * prices.largeSide;

                  const proteinOver = protein - needs.protein;
                  const veggieOver = veggie - needs.veggie;
                  const overScore = proteinOver + veggieOver;

                  const orderOptions = [];

                  if (meal.upgradeLabel) orderOptions.push(meal.upgradeLabel);
                  if (vegMode.label) orderOptions.push(vegMode.label);

                  if (largeAddonCount > 0) {
                    orderOptions.push(`主菜／副菜大份 × ${largeAddonCount}`);
                  }

                  if (smallAddonCount > 0) {
                    orderOptions.push(`主菜／副菜小份 × ${smallAddonCount}`);
                  }

                  if (veg.vegSideCount > 0) {
                    orderOptions.push(`（蔬菜類）副菜大份 × ${veg.vegSideCount}`);
                    orderOptions.push("也可自行預備蔬菜，豐富蔬菜種類");
                  }

                  if (orderOptions.length === 0) {
                    orderOptions.push("基本套餐");
                  }

                  const detailItems = [
                    `提供肉類 ${protein}g`,
                    `提供蔬菜 ${veggie}g`
                  ];

                  if (mainAddonForVeggie > 0) {
                    detailItems.push(`其中主菜配料約增加蔬菜 ${mainAddonForVeggie}g`);
                  }

                  if (veg.vegSideCount > 0) {
                    detailItems.push(`（蔬菜類）副菜補充蔬菜 ${veg.vegSideCount * 200}g`);
                    detailItems.push("也可以自行預備蔬菜，讓蔬菜種類更豐富");
                  }

                  if (meal.upgradeLabel) detailItems.push("含主菜升級");
                  if (vegMode.key === "large") detailItems.push("時蔬加大 1 次");
                  if (vegMode.key === "double") detailItems.push("時蔬雙拼 1 次");
                  if (largeAddonCount > 0) detailItems.push(`大份肉類加點 ${largeAddonCount} 份`);
                  if (smallAddonCount > 0) detailItems.push(`小份肉類加點 ${smallAddonCount} 份`);

                  const plan = {
                    key: "",
                    mealKey: meal.key,
                    name: meal.name,
                    orderOptions,
                    detailItems,
                    protein,
                    veggie,
                    price,
                    proteinOver,
                    veggieOver,
                    overScore,
                    totalAddonCount,
                    proteinAddonCount,
                    veggieAddonCount,
                    largeAddonCount,
                    smallAddonCount,
                    mainAddonForVeggie,
                    vegSideCount: veg.vegSideCount,
                    vegMode: vegMode.key,
                    vegLargeCount: vegMode.key === "large" ? 1 : 0,
                    vegDoubleCount: vegMode.key === "double" ? 1 : 0,
                    proteinRate: needs.protein === 0 ? 0 : Math.round((protein / needs.protein) * 100),
                    veggieRate: needs.veggie === 0 ? 0 : Math.round((veggie / needs.veggie) * 100),
                    fit: getFitLabel(needs.protein, needs.veggie)
                  };

                  plan.key = makePlanKey(plan);
                  plans.push(plan);
                });
              });
            });
          }
        }
      });

      const uniquePlans = [];
      const usedKeys = new Set();

      plans.forEach(plan => {
        if (!usedKeys.has(plan.key)) {
          usedKeys.add(plan.key);
          uniquePlans.push(plan);
        }
      });

      const sortedPlans = uniquePlans.sort((a, b) => {
        if (a.overScore !== b.overScore) return a.overScore - b.overScore;
        if (a.totalAddonCount !== b.totalAddonCount) return a.totalAddonCount - b.totalAddonCount;
        if (a.price !== b.price) return a.price - b.price;
        if (a.proteinAddonCount !== b.proteinAddonCount) return a.proteinAddonCount - b.proteinAddonCount;
        return a.protein - b.protein;
      });

      const selected = selectThreeCustomerPlans(sortedPlans, needs);

      return selected;
    }


    function planDistance(plan, targetProteinOver, targetVeggieOver) {
      return Math.abs(plan.proteinOver - targetProteinOver)
        + Math.abs(plan.veggieOver - targetVeggieOver)
        + plan.totalAddonCount * 18
        + Math.max(0, plan.price / 100);
    }

    function clonePlanWithRole(plan, role) {
      return Object.assign({}, plan, {
        displayRole: role.key,
        displayBadge: role.badge,
        displayClass: role.className,
        displayTitle: role.title,
        displaySubtitle: role.subtitle
      });
    }

    function selectThreeCustomerPlans(sortedPlans, needs) {
      if (sortedPlans.length === 0) return [];

      const roles = {
        best: {
          key: "best",
          badge: "⭐ 最推薦",
          className: "featured",
          title: "最接近您家今天的需求",
          subtitle: "份量最貼近，不容易吃不夠，也比較不會剩太多。"
        },
        rich: {
          key: "rich",
          badge: "👍 吃得更豐盛",
          className: "rich",
          title: "怕不夠吃可以選這組",
          subtitle: "份量更有餘裕，適合家人食量較大或今天想吃飽一點。"
        },
        bento: {
          key: "bento",
          badge: "🍱 留便當首選",
          className: "bento",
          title: "份量最充足，可能可留隔餐",
          subtitle: "蛋白質與蔬菜都有較明顯餘裕，適合想順便準備隔天便當。"
        }
      };

      const used = new Set();
      const selected = [];

      const best = sortedPlans[0];
      selected.push(clonePlanWithRole(best, roles.best));
      used.add(best.key);

      let richCandidates = sortedPlans.filter(plan =>
        !used.has(plan.key) &&
        (
          plan.proteinOver >= 80 ||
          plan.veggieOver >= 60 ||
          plan.price > best.price
        )
      );

      if (richCandidates.length === 0) {
        richCandidates = sortedPlans.filter(plan => !used.has(plan.key));
      }

      richCandidates.sort((a, b) => {
        const aScore = planDistance(a, 140, 80);
        const bScore = planDistance(b, 140, 80);
        if (aScore !== bScore) return aScore - bScore;
        if (a.totalAddonCount !== b.totalAddonCount) return a.totalAddonCount - b.totalAddonCount;
        return a.price - b.price;
      });

      const rich = richCandidates[0];
      if (rich) {
        selected.push(clonePlanWithRole(rich, roles.rich));
        used.add(rich.key);
      }

      let bentoCandidates = sortedPlans.filter(plan =>
        !used.has(plan.key) &&
        plan.proteinOver >= 150 &&
        plan.veggieOver >= 150
      );

      if (bentoCandidates.length === 0) {
        bentoCandidates = sortedPlans.filter(plan =>
          !used.has(plan.key) &&
          (plan.proteinOver >= 150 || plan.veggieOver >= 150)
        );
      }

      if (bentoCandidates.length === 0) {
        bentoCandidates = sortedPlans.filter(plan => !used.has(plan.key));
      }

      bentoCandidates.sort((a, b) => {
        const aScore = planDistance(a, 260, 180);
        const bScore = planDistance(b, 260, 180);
        if (aScore !== bScore) return aScore - bScore;
        if (a.price !== b.price) return a.price - b.price;
        return a.totalAddonCount - b.totalAddonCount;
      });

      const bento = bentoCandidates[0];
      if (bento) {
        selected.push(clonePlanWithRole(bento, roles.bento));
        used.add(bento.key);
      }

      while (selected.length < 3) {
        const next = sortedPlans.find(plan => !used.has(plan.key));
        if (!next) break;
        const role = selected.length === 1 ? roles.rich : roles.bento;
        selected.push(clonePlanWithRole(next, role));
        used.add(next.key);
      }

      return selected;
    }

    function getDifferenceText(kind, over) {
      const icon = kind === "protein" ? "🥩 蛋白質" : "🥬 蔬菜";

      if (over <= 30) {
        return `${icon}：幾乎剛剛好`;
      }

      if (over <= 100) {
        return `${icon}：多 ${over}g，份量稍微有餘裕`;
      }

      if (over <= 180) {
        return `${icon}：多 ${over}g，吃起來會比較充足`;
      }

      return `${icon}：多 ${over}g，可能可留隔餐`;
    }

    function getCustomerFitMessage(plan) {
      if (plan.displayRole === "best") {
        return "這組最適合想「剛好吃飽、不想浪費」的家庭。";
      }

      if (plan.displayRole === "rich") {
        return "這組適合家裡有人食量大、怕不夠吃，或今天菜色很受歡迎。";
      }

      return "這組適合想多準備一點，晚餐吃完後也有機會留下便當。";
    }

    function getPlanContentText(options) {
      const main = options.main || "基本套餐";
      const addons = options.addons || "無需額外加點";

      if (addons === "無需額外加點") {
        return main;
      }

      return `${main}｜加點：${addons}`;
    }

    function getOrderMealType(plan) {
      if (plan.mealKey === "double") return "DOUBLE";
      return "LIGHT";
    }

    function getOrderVegMode(plan) {
      if (plan.vegMode === "large") return "TODAY_L";
      if (plan.vegMode === "double") return "TWIN";
      return "TODAY";
    }

    function getOrderUpgradeFlag(plan) {
      return plan.mealKey === "light-upgrade" ? "1" : "0";
    }

    function applyPlan(planKey) {
      const plan = window.latestRecommendationPlans
        ? window.latestRecommendationPlans.find(item => item.key === planKey)
        : null;

      if (!plan) {
        alert("找不到這個推薦方案，請重新整理後再試一次。");
        return;
      }

      const payload = {
        source: "hearth-table-calculator",
        createdAt: new Date().toISOString(),
        role: plan.displayRole,
        title: plan.displayBadge,
        mealKey: plan.mealKey,
        name: plan.name,
        orderOptions: plan.orderOptions,
        protein: plan.protein,
        veggie: plan.veggie,
        proteinOver: plan.proteinOver,
        veggieOver: plan.veggieOver,
        largeAddonCount: plan.largeAddonCount,
        smallAddonCount: plan.smallAddonCount,
        vegMode: plan.vegMode,
        vegSideCount: plan.vegSideCount,
        price: Math.round(plan.price)
      };

      try {
        localStorage.setItem("hearthTableRecommendedPlan", JSON.stringify(payload));
      } catch (error) {
        console.warn("無法寫入 localStorage", error);
      }

      const params = new URLSearchParams();
      params.set("from", "recommendation");
      params.set("meal", getOrderMealType(plan));
      params.set("veg", getOrderVegMode(plan));
      params.set("upgrade", getOrderUpgradeFlag(plan));
      params.set("largeAddons", String(plan.largeAddonCount || 0));
      params.set("smallAddons", String(plan.smallAddonCount || 0));
      params.set("role", plan.displayRole || "");
      params.set("title", plan.displayTitle || "");
      params.set("protein", String(plan.protein || 0));
      params.set("veggie", String(plan.veggie || 0));

      window.location.href = ORDER_SYSTEM_URL + "?" + params.toString();
    }


    function renderMembers() {
      els.memberCount.textContent = `${members.length} 位`;

      if (members.length === 0) {
        els.members.innerHTML = `<div class="empty">尚未新增成員<br>請先加入家庭成員開始推薦</div>`;
        return;
      }

      els.members.innerHTML = members.map(member => {
        const base = nutritionBase[member.type];
        const isChild = member.type === "child";
        const protein = base.protein + (!isChild && member.bigAppetite ? 50 : 0);
        const veggie = Math.max(0, base.veggie - (!isChild && member.lessVeggie ? 50 : 0));
        const rice = riceBase[member.type][member.lessRice ? "less" : "normal"];

        const tags = [];

        if (!isChild && member.bigAppetite) tags.push("食量大");
        if (!isChild && member.lessVeggie) tags.push("不愛吃菜");
        if (member.lessRice) tags.push("飯量少");
        if (tags.length === 0) tags.push("標準食量");

        return `
          <div class="member-item">
            <div class="member-main">
              <div class="member-name">${base.emoji} ${base.label}</div>
              <div class="member-meta">
                肉類份量 ${protein}g・蔬菜份量 ${veggie}g・米 ${rice} 杯<br>
                ${tags.join("・")}
              </div>
            </div>
            <button class="btn btn-danger" onclick="removeMember(${member.id})">刪除</button>
          </div>
        `;
      }).join("");
    }

    function splitPlanOptions(plan) {
      const mainKeywords = ["基本套餐", "主菜升級", "時蔬加大", "時蔬雙拼"];

      const mainOptions = plan.orderOptions.filter(option =>
        mainKeywords.some(keyword => option.includes(keyword))
      );

      const addonOptions = plan.orderOptions.filter(option =>
        !mainKeywords.some(keyword => option.includes(keyword))
      );

      return {
        main: mainOptions.length > 0 ? mainOptions.join("、") : "基本套餐",
        addons: addonOptions.length > 0 ? addonOptions.join("、") : "無需額外加點"
      };
    }

    function renderRecommendations(needs) {
      if (members.length === 0) {
        els.recommendations.innerHTML = `<div class="empty">新增成員後，這裡會自動出現推薦方案。</div>`;
        return;
      }

      const plans = enumerateRecommendations(needs);
      window.latestRecommendationPlans = plans;

      if (plans.length === 0) {
        els.recommendations.innerHTML = `<div class="empty">目前找不到符合需求的組合，請調整餐點資料或價格設定。</div>`;
        return;
      }

      els.recommendations.innerHTML = plans.map((plan) => {
        const options = splitPlanOptions(plan);
        const contentText = getPlanContentText(options);
        const fitMessage = getCustomerFitMessage(plan);

        return `
          <article class="plan ${plan.displayClass || ""}">
            <div class="plan-ribbon">${plan.displayBadge}</div>

            <div class="plan-header">
              <div>
                <h3 class="plan-title">${plan.displayTitle}</h3>
                <p class="plan-subtitle">${plan.displaySubtitle}</p>
              </div>
              <div class="plan-price">${formatMoney(plan.price)}</div>
            </div>

            <div class="plan-content-box">
              <div class="plan-content-title">建議點餐方式</div>
              <div class="plan-content-text">${plan.name}：${contentText}</div>
            </div>

            <div class="nutrition-pair">
              <div class="nutrition-chip protein">
                <div class="nutrition-label">蛋白質總量</div>
                <div class="nutrition-value">${plan.protein}g</div>
              </div>

              <div class="nutrition-chip veggie">
                <div class="nutrition-label">蔬菜總量</div>
                <div class="nutrition-value">${plan.veggie}g</div>
              </div>
            </div>

            <div class="gap-box">
              <div class="gap-line">${getDifferenceText("protein", plan.proteinOver)}</div>
              <div class="gap-line">${getDifferenceText("veggie", plan.veggieOver)}</div>
            </div>

            <div class="fit-message">${fitMessage}</div>

            <button class="btn apply-btn" onclick="applyPlan('${plan.key}')">套用這個方案</button>
          </article>
        `;
      }).join("");
    }

    function renderRice() {
      if (members.length === 0) {
        els.riceResult.innerHTML = `<div class="empty">新增成員後，這裡會幫你算今天要洗幾杯米。</div>`;
        return;
      }

      const riceCups = calculateRiceCups();
      const rounded = Math.round(riceCups * 10) / 10;
      const more = Math.round((riceCups + 0.2) * 10) / 10;

      els.riceResult.innerHTML = `
        <div class="rice-big">今天建議洗米：約 ${rounded.toFixed(1)} 杯</div>
        <div class="rice-note">
          如果今天菜色很下飯、家人比較餓，可以抓到約 ${more.toFixed(1)} 杯。<br>
          天氣熱或食慾比較差，就照建議量煮，較不容易剩飯。
        </div>
      `;
    }

    function render() {
      const needs = calculateNeeds();

      els.proteinNeed.textContent = needs.protein;
      els.veggieNeed.textContent = needs.veggie;

      renderMembers();
      renderRecommendations(needs);
      renderRice();
    }

    els.addMemberBtn.addEventListener("click", addMember);

    els.memberType.addEventListener("change", () => {
      if (els.memberType.value === "child") {
        els.bigAppetite.checked = false;
        els.lessVeggie.checked = false;
      }
    });

    Object.values(els.prices).forEach(input => {
      input.addEventListener("input", render);
    });

    render();
  </script>
</body>
</html>
